services:
  web:
    build: .
    restart: unless-stopped
    environment:
      # Se define en el archivo .env del servidor (no se sube a Git)
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
      # Dónde están los modelos entrenados (se copian al servidor aparte; ver model/README.md)
      MODELOS_DIR: /srv/imagebio/model
      # Hilos que usa PyTorch por análisis. Si no se define, usa hasta 4 según las CPU del servidor
      TORCH_HILOS: ${TORCH_HILOS:-}
      OPENBLAS_NUM_THREADS: "1"
      # Solo desarrollo: 1 muestra un temporizador en la pantalla de espera. En producción se deja sin definir.
      MOSTRAR_TEMPORIZADOR: ${MOSTRAR_TEMPORIZADOR:-}
    volumes:
      - datos:/srv/imagebio/instance
      - ./model:/srv/imagebio/model:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx.conf es la configuración con HTTPS. En un servidor nuevo, antes de tener el certificado,
      # se define NGINX_CONF=nginx-http.conf en el archivo .env (ver docs/despliegue.md)
      - ./deploy/${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot-web:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro

volumes:
  datos:
  certbot-web:
  certbot-certs:
